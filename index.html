<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snack StacK - Food Truck Empire</title>
  
  <style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  image-rendering: pixelated;
}

body {
  background-color: #1a1a2e;
  background-image: 
    repeating-linear-gradient(0deg, transparent, transparent 31px, #16213e 31px, #16213e 32px),
    repeating-linear-gradient(90deg, transparent, transparent 31px, #16213e 31px, #16213e 32px);
  font-family: 'Press Start 2P', monospace;
  text-align: center;
  padding: 20px;
  min-height: 100vh;
  color: #e8e8e8;
}

h1 {
  font-size: 28px;
  margin: 10px 0;
  color: #ff6b35;
  text-shadow: 4px 4px 0px #7a2e00, -2px -2px 0px #000;
  letter-spacing: 4px;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 20px 0;
  flex-wrap: wrap;
}

.stat-item {
  background: #0f3460;
  padding: 12px 18px;
  border: 4px solid #e8e8e8;
  box-shadow: 4px 4px 0px #000;
  font-size: 11px;
  image-rendering: pixelated;
}

#money { color: #2ecc71; }
#earnings { color: #3498db; }
#customers-count { color: #e91e63; }

canvas {
  display: block;
  margin: 15px auto;
  border: 6px solid #e8e8e8;
  box-shadow: 8px 8px 0px #000;
  cursor: crosshair;
  max-width: 100%;
  image-rendering: pixelated;
}

.game-panels {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  max-width: 1200px;
  margin: 20px auto;
  padding: 0 10px;
}

.panel {
  background: #0f3460;
  border: 4px solid #e8e8e8;
  box-shadow: 6px 6px 0px #000;
  padding: 16px;
  text-align: left;
}

.panel h3 {
  margin: 0 0 14px 0;
  color: #ff6b35;
  font-size: 11px;
  text-align: center;
  border-bottom: 4px solid #ff6b35;
  padding-bottom: 10px;
  letter-spacing: 2px;
}

.panel-content {
  max-height: 200px;
  overflow-y: auto;
}

.panel-content::-webkit-scrollbar {
  width: 8px;
}

.panel-content::-webkit-scrollbar-track {
  background: #1a1a2e;
}

.panel-content::-webkit-scrollbar-thumb {
  background: #ff6b35;
  border: 2px solid #000;
}

.recipe-item, .ingredient-item, .team-member {
  margin: 8px 0;
  padding: 8px;
  font-size: 9px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 3px solid #e8e8e8;
  background: #16213e;
  line-height: 1.6;
}

.recipe-unlocked {
  border-color: #2ecc71;
  color: #2ecc71;
}

.recipe-locked {
  border-color: #555;
  color: #555;
}

.unlock-btn {
  padding: 6px 10px;
  font-size: 8px;
  font-family: 'Press Start 2P', monospace;
  background: #ff6b35;
  border: 3px solid #e8e8e8;
  box-shadow: 3px 3px 0px #000;
  cursor: pointer;
  color: #fff;
  transition: none;
}

.unlock-btn:hover {
  background: #ffcd38;
  color: #000;
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0px #000;
}

.controls {
  margin: 20px 0;
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}

button {
  padding: 14px 24px;
  font-size: 11px;
  font-family: 'Press Start 2P', monospace;
  border: 4px solid #e8e8e8;
  box-shadow: 6px 6px 0px #000;
  cursor: pointer;
  font-weight: normal;
  transition: none;
  text-transform: uppercase;
  letter-spacing: 1px;
}

button:hover {
  transform: translate(3px, 3px);
  box-shadow: 3px 3px 0px #000;
}

button:active {
  transform: translate(6px, 6px);
  box-shadow: none;
}

#buyIngredientsBtn {
  background: #0f3460;
  color: #3498db;
  border-color: #3498db;
}

#upgradeBtn {
  background: #0f3460;
  color: #ffcd38;
  border-color: #ffcd38;
  animation: blink 1s step-end infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

#log {
  margin: 20px auto;
  font-size: 11px;
  color: #e8e8e8;
  background: #0f3460;
  padding: 16px 20px;
  max-width: 900px;
  border: 4px solid #e8e8e8;
  box-shadow: 6px 6px 0px #000;
  min-height: 55px;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 2;
}

.controls-hint {
  background: #0f3460;
  color: #2ecc71;
  padding: 12px;
  border: 4px solid #2ecc71;
  box-shadow: 4px 4px 0px #000;
  margin: 10px auto;
  max-width: 700px;
  font-size: 9px;
  line-height: 2;
}

.achievement {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #ffcd38;
  color: #000;
  padding: 16px 24px;
  font-size: 11px;
  border: 4px solid #000;
  box-shadow: 6px 6px 0px #000;
  animation: slideIn 0.1s steps(1), slideOut 0.1s steps(1) 2.5s;
  z-index: 1000;
  font-family: 'Press Start 2P', monospace;
  line-height: 2;
}

@keyframes slideIn {
  from { transform: translateX(400px); }
  to { transform: translateX(0); }
}

@keyframes slideOut {
  from { transform: translateX(0); opacity: 1; }
  to { transform: translateX(400px); opacity: 0; }
}
</style>
</head>
<body>
  <h1>🍔 SNACK STACK 🍟</h1>
  
  <div class="stats">
    <div class="stat-item" id="money">💰 Money: $100</div>
    <div class="stat-item" id="earnings">📈 $/min: $0</div>
    <div class="stat-item" id="customers-count">👥 Served: 0</div>
  </div>
  
  <canvas id="game"></canvas>
  
  <div class="controls-hint">
    🎮 WASD to Move • E to Serve Customers • Your Sibling Helps Automatically!
  </div>
  
  <div class="game-panels">
    <div class="panel">
      <h3>📋 Recipes</h3>
      <div id="recipes" class="panel-content"></div>
    </div>
    
    <div class="panel">
      <h3>🥡 Inventory</h3>
      <div id="ingredients" class="panel-content"></div>
    </div>
    
    <div class="panel">
      <h3>👥 Your Team</h3>
      <div id="team" class="panel-content"></div>
    </div>

    <div class="panel">
      <h3>📊 Statistics</h3>
      <div id="stats" class="panel-content"></div>
    </div>
  </div>
  
  <div class="controls">
    <button id="buyIngredientsBtn">🛒 Buy Ingredients ($50)</button>
    <button id="upgradeBtn" style="display:none;">⭐ Open Restaurant! ($5,000)</button>
  </div>
  
  <div id="log">Welcome to Snack StacK! Start serving customers to build your empire! 🚀</div>
  
  <script>
    console.log("🍔 Starting Snack StacK...");
    
    // ============================================
    // CANVAS SETUP
    // ============================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    canvas.width = 900;
    canvas.height = 550;
    canvas.style.width = Math.min(900, window.innerWidth - 40) + "px";

    // ============================================
    // GAME STATE
    // ============================================
    let money = 100;
    let totalEarned = 0;
    let totalCustomersServed = 0;
    let gameTime = 0;
    let customers = [];
    let nextCustomerId = 0;
    let earningsPerMinute = 0;
    let lastEarningsUpdate = Date.now();
    let achievementQueue = [];

    // ============================================
    // RUSH HOUR
    // ============================================
    let rushHour = false;
    let rushTimer = 0;
    let rushWarning = false;
    let rushWarningTimer = 0;
    let nextRushIn = 1800; // ~3 minutes at 60fps
    let rushBonus = 0;

    function updateRushHour() {
      if (rushWarning) {
        rushWarningTimer++;
        if (rushWarningTimer > 180) {
          rushWarning = false;
          rushHour = true;
          rushTimer = 0;
          rushBonus = 0;
          updateLog("🔥 RUSH HOUR! Double tips for 60 seconds!");
        }
        return;
      }

      if (rushHour) {
        rushTimer++;
        if (rushTimer > 3600) {
          rushHour = false;
          nextRushIn = 1800;
          money += rushBonus;
          showAchievement(`⭐ Rush Over! +$${rushBonus} bonus!`);
          updateLog(`✅ Rush Hour over! Earned $${rushBonus} bonus!`);
        }
        return;
      }

      nextRushIn--;
      if (nextRushIn <= 0) {
        rushWarning = true;
        rushWarningTimer = 0;
        updateLog("⚠️ RUSH HOUR INCOMING! Get ready!");
      }
    }

    function drawRushHour() {
      if (rushWarning) {
        ctx.fillStyle = `rgba(255, 200, 0, ${0.2 + 0.15 * Math.sin(Date.now() / 100)})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "center";
        ctx.fillText("⚠️ RUSH HOUR INCOMING! ⚠️", canvas.width / 2, 50);
        ctx.textAlign = "left";
      }

      if (rushHour) {
        ctx.fillStyle = "rgba(255, 50, 0, 0.07)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff4444";
        ctx.font = "bold 18px Arial";
        ctx.textAlign = "center";
        const secondsLeft = Math.ceil((3600 - rushTimer) / 60);
        ctx.fillText(`🔥 RUSH HOUR - ${secondsLeft}s left | Bonus: $${rushBonus}`, canvas.width / 2, 28);
        ctx.textAlign = "left";
      }
    }

    // ============================================
    // PLAYER
    // ============================================
    const player = {
      x: 150,
      y: 400,
      size: 30,
      speed: 4,
      color: "#ff6b35",
      name: "You"
    };

    // ============================================
    // SIBLING HELPER
    // ============================================
    const sibling = {
      x: 200,
      y: 400,
      size: 30,
      speed: 2.5,
      color: "#3498db",
      name: "Your Sibling",
      target: null,
      isServing: false,
      servingTimer: 0,
      totalServed: 0
    };

    // ============================================
    // FOOD TRUCK
    // ============================================
    const foodTruck = {
      x: 400,
      y: 220,
      width: 150,
      height: 100
    };

    // ============================================
    // RECIPES & INGREDIENTS
    // ============================================
    const recipes = {
      burger: {
        name: "🍔 Burger",
        unlocked: true,
        ingredients: { beef: 1, bun: 1, lettuce: 1 },
        price: 10,
        cost: 4,
        timesSold: 0
      },
      fries: {
        name: "🍟 Fries",
        unlocked: true,
        ingredients: { potato: 2, oil: 1 },
        price: 6,
        cost: 2,
        timesSold: 0
      },
      hotdog: {
        name: "🌭 Hot Dog",
        unlocked: false,
        ingredients: { sausage: 1, bun: 1 },
        price: 8,
        cost: 3,
        unlockCost: 250,
        timesSold: 0
      },
      tenders: {
        name: "🍗 Chicken Tenders",
        unlocked: false,
        ingredients: { chicken: 2, flour: 1, oil: 1 },
        price: 12,
        cost: 5,
        unlockCost: 400,
        timesSold: 0
      },
      pizza: {
        name: "🍕 Pizza Slice",
        unlocked: false,
        ingredients: { dough: 1, cheese: 1, tomato: 1 },
        price: 15,
        cost: 6,
        unlockCost: 800,
        timesSold: 0
      },
      taco: {
        name: "🌮 Taco",
        unlocked: false,
        ingredients: { beef: 1, tortilla: 1, lettuce: 1, cheese: 1 },
        price: 9,
        cost: 4,
        unlockCost: 600,
        timesSold: 0
      }
    };

    let ingredients = {
      beef: 15,
      chicken: 10,
      potato: 20,
      bun: 15,
      oil: 10,
      lettuce: 10,
      sausage: 0,
      flour: 0,
      dough: 0,
      cheese: 0,
      tomato: 0,
      tortilla: 0
    };

    // ============================================
    // INPUT
    // ============================================
    const keys = {};
    document.addEventListener("keydown", (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.key.toLowerCase() === 'e') {
        tryServeCustomer();
      }
    });
    document.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

    // ============================================
    // CUSTOMER SYSTEM
    // ============================================
    class Customer {
      constructor(recipe) {
        this.id = nextCustomerId++;
        this.recipe = recipe;
        this.x = -50;
        this.y = 380;
        this.size = 30;
        this.speed = 1 + Math.random() * 0.5;
        this.targetX = foodTruck.x - 120;
        this.waiting = false;
        this.waitTimer = 0;
        this.maxWaitTime = rushHour ? 150 : 240;
        this.color = ["#9b59b6", "#e67e22", "#1abc9c", "#e91e63"][Math.floor(Math.random() * 4)];
        this.isServed = false;
        this.patience = 1.0;
      }
      
      update() {
        if (!this.waiting) {
          if (this.x < this.targetX) {
            this.x += this.speed;
          } else {
            this.waiting = true;
          }
        } else {
          this.waitTimer++;
          this.patience = 1 - (this.waitTimer / this.maxWaitTime);
          
          if (this.waitTimer > this.maxWaitTime && !this.isServed) {
            this.leave();
            return false;
          }
        }
        return true;
      }
      
      serve() {
        const recipe = recipes[this.recipe];
        
        let canMake = true;
        for (let ing in recipe.ingredients) {
          if (ingredients[ing] < recipe.ingredients[ing]) {
            canMake = false;
            break;
          }
        }
        
        if (!canMake) {
          updateLog("❌ Not enough ingredients for " + recipe.name + "!");
          return false;
        }
        
        for (let ing in recipe.ingredients) {
          ingredients[ing] -= recipe.ingredients[ing];
        }
        
        const tipMultiplier = rushHour ? 0.6 : 0.3;
        const tip = Math.floor(recipe.price * this.patience * tipMultiplier);
        const total = recipe.price + tip;
        
        money += total;
        totalEarned += total;
        totalCustomersServed++;
        recipe.timesSold++;
        this.isServed = true;

        if (rushHour) {
          rushBonus += tip;
        }
        
        if (tip > 0) {
          updateLog(`✅ Served ${recipe.name} for $${recipe.price} + $${tip} tip!${rushHour ? ' 🔥' : ''}`);
        } else {
          updateLog(`✅ Served ${recipe.name} for $${recipe.price}!`);
        }
        
        checkAchievements();
        return true;
      }
      
      leave() {
        if (!this.isServed) {
          updateLog("😞 Customer left hungry!");
        }
      }
      
      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        
        ctx.fillStyle = "#fff";
        ctx.fillRect(this.x + 7, this.y + 8, 7, 7);
        ctx.fillRect(this.x + 16, this.y + 8, 7, 7);
        
        if (this.waiting) {
          ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
          ctx.beginPath();
          ctx.arc(this.x + 15, this.y - 20, 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#333";
          ctx.lineWidth = 2;
          ctx.stroke();
          
          ctx.font = "24px Arial";
          ctx.fillText(recipes[this.recipe].name.split(' ')[0], this.x - 3, this.y - 12);
          
          const barWidth = 35;
          const barHeight = 6;
          const fillWidth = this.patience * barWidth;
          
          const gradient = ctx.createLinearGradient(this.x, 0, this.x + barWidth, 0);
          if (this.patience > 0.6) {
            gradient.addColorStop(0, "#2ecc71");
            gradient.addColorStop(1, "#27ae60");
          } else if (this.patience > 0.3) {
            gradient.addColorStop(0, "#f39c12");
            gradient.addColorStop(1, "#e67e22");
          } else {
            gradient.addColorStop(0, "#e74c3c");
            gradient.addColorStop(1, "#c0392b");
          }
          
          ctx.fillStyle = gradient;
          ctx.fillRect(this.x, this.y - 35, fillWidth, barHeight);
          ctx.strokeStyle = "#2c3e50";
          ctx.lineWidth = 2;
          ctx.strokeRect(this.x, this.y - 35, barWidth, barHeight);
        }
      }
    }

    function spawnCustomer() {
      const availableRecipes = Object.keys(recipes).filter(r => recipes[r].unlocked);
      if (availableRecipes.length === 0) return;
      
      const weights = availableRecipes.map(r => recipes[r].price);
      const totalWeight = weights.reduce((a, b) => a + b, 0);
      let random = Math.random() * totalWeight;
      
      let selectedRecipe = availableRecipes[0];
      for (let i = 0; i < availableRecipes.length; i++) {
        random -= weights[i];
        if (random <= 0) {
          selectedRecipe = availableRecipes[i];
          break;
        }
      }
      
      customers.push(new Customer(selectedRecipe));
    }

    // Single interval that checks rush hour state for spawn rate
    setInterval(() => {
      const spawnChance = rushHour ? 0.75 : 0.35;
      const maxCustomers = rushHour ? 8 : 6;
      if (Math.random() < spawnChance && customers.length < maxCustomers) {
        spawnCustomer();
      }
    }, 1500);

    // ============================================
    // SERVING MECHANICS
    // ============================================
    function tryServeCustomer() {
      let nearest = null;
      let minDist = 100;
      
      for (let i = 0; i < customers.length; i++) {
        const c = customers[i];
        if (c.waiting && !c.isServed) {
          const dx = player.x - c.x;
          const dy = player.y - c.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < minDist) {
            nearest = c;
            minDist = dist;
          }
        }
      }
      
      if (nearest) {
        if (nearest.serve()) {
          setTimeout(() => {
            customers = customers.filter(c => c.id !== nearest.id);
          }, 300);
        }
      }
    }

    function updateSibling() {
      if (sibling.isServing) {
        sibling.servingTimer++;
        if (sibling.servingTimer > 90) {
          sibling.isServing = false;
          sibling.servingTimer = 0;
          if (sibling.target) {
            if (sibling.target.serve()) {
              sibling.totalServed++;
              setTimeout(() => {
                customers = customers.filter(c => c.id !== sibling.target.id);
              }, 300);
            }
            sibling.target = null;
          }
        }
        return;
      }
      
      let target = null;
      let oldestWaitTime = -1;
      
      for (let c of customers) {
        if (c.waiting && !c.isServed && c.waitTimer > oldestWaitTime) {
          target = c;
          oldestWaitTime = c.waitTimer;
        }
      }
      
      if (target) {
        sibling.target = target;
        const dx = sibling.x - target.x;
        const dy = sibling.y - target.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist > 50) {
          const angle = Math.atan2(target.y - sibling.y, target.x - sibling.x);
          sibling.x += Math.cos(angle) * sibling.speed;
          sibling.y += Math.sin(angle) * sibling.speed;
        } else {
          sibling.isServing = true;
          sibling.servingTimer = 0;
        }
      } else {
        const dx = sibling.x - 200;
        const dy = sibling.y - 400;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 5) {
          const angle = Math.atan2(400 - sibling.y, 200 - sibling.x);
          sibling.x += Math.cos(angle) * sibling.speed;
          sibling.y += Math.sin(angle) * sibling.speed;
        }
      }
    }

    // ============================================
    // PLAYER MOVEMENT
    // ============================================
    function movePlayer() {
      if (keys["w"] || keys["arrowup"]) player.y -= player.speed;
      if (keys["s"] || keys["arrowdown"]) player.y += player.speed;
      if (keys["a"] || keys["arrowleft"]) player.x -= player.speed;
      if (keys["d"] || keys["arrowright"]) player.x += player.speed;
      
      player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
      player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));
    }

    // ============================================
    // DRAWING
    // ============================================
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, "#87CEEB");
      skyGrad.addColorStop(0.65, "#90EE90");
      skyGrad.addColorStop(1, "#8B7355");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = "#8B7355";
      ctx.fillRect(0, canvas.height - 170, canvas.width, 170);
      
      drawFoodTruck();
      
      customers.forEach(c => c.draw());
      
      drawCharacter(sibling, "SIB");
      if (sibling.isServing) {
        ctx.fillStyle = "#2ecc71";
        ctx.font = "bold 14px Arial";
        ctx.fillText("Cooking...", sibling.x - 15, sibling.y - 15);
      }
      
      drawCharacter(player, "YOU");
      
      let nearCustomer = null;
      for (let i = 0; i < customers.length; i++) {
        const c = customers[i];
        const dx = player.x - c.x;
        const dy = player.y - c.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (c.waiting && !c.isServed && dist < 100) {
          nearCustomer = c;
          break;
        }
      }
      
      if (nearCustomer) {
        ctx.fillStyle = "rgba(46, 204, 113, 0.9)";
        ctx.fillRect(player.x - 35, player.y - 30, 100, 25);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 16px Arial";
        ctx.fillText("Press E", player.x - 20, player.y - 12);
      }

      // Draw rush hour overlay on top of everything
      drawRushHour();
    }

    function drawFoodTruck() {
      ctx.fillStyle = "#e74c3c";
      ctx.fillRect(foodTruck.x, foodTruck.y, foodTruck.width, foodTruck.height);
      
      ctx.fillStyle = "rgba(0,0,0,0.2)";
      ctx.fillRect(foodTruck.x, foodTruck.y + foodTruck.height, foodTruck.width, 10);
      
      ctx.fillStyle = "#c0392b";
      ctx.fillRect(foodTruck.x, foodTruck.y + 60, foodTruck.width, 40);
      
      ctx.fillStyle = "#2c3e50";
      ctx.beginPath();
      ctx.arc(foodTruck.x + 35, foodTruck.y + 100, 15, 0, Math.PI * 2);
      ctx.arc(foodTruck.x + 115, foodTruck.y + 100, 15, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = "#95a5a6";
      ctx.beginPath();
      ctx.arc(foodTruck.x + 35, foodTruck.y + 100, 8, 0, Math.PI * 2);
      ctx.arc(foodTruck.x + 115, foodTruck.y + 100, 8, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = "#3498db";
      ctx.fillRect(foodTruck.x + 25, foodTruck.y + 15, 100, 40);
      
      ctx.strokeStyle = "#2c3e50";
      ctx.lineWidth = 4;
      ctx.strokeRect(foodTruck.x + 25, foodTruck.y + 15, 100, 40);
      
      ctx.fillStyle = "#fff";
      ctx.font = "bold 18px Arial";
      ctx.fillText("SNACK", foodTruck.x + 45, foodTruck.y + 35);
      ctx.fillText("STACK", foodTruck.x + 45, foodTruck.y + 50);
    }

    function drawCharacter(char, label) {
      ctx.fillStyle = char.color;
      ctx.fillRect(char.x, char.y, char.size, char.size);
      
      ctx.fillStyle = "#fff";
      ctx.fillRect(char.x + 7, char.y + 8, 7, 7);
      ctx.fillRect(char.x + 16, char.y + 8, 7, 7);
      
      ctx.fillStyle = "#fff";
      ctx.font = "bold 12px Arial";
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 3;
      ctx.strokeText(label, char.x + 3, char.y + 22);
      ctx.fillText(label, char.x + 3, char.y + 22);
    }

    // ============================================
    // UI UPDATES
    // ============================================
    function updateUI() {
      document.getElementById("money").textContent = `💰 Money: $${Math.floor(money)}`;
      document.getElementById("earnings").textContent = `📈 $/min: $${earningsPerMinute}`;
      document.getElementById("customers-count").textContent = `👥 Served: ${totalCustomersServed}`;
      
      let recipesHTML = "";
      for (let key in recipes) {
        const r = recipes[key];
        if (r.unlocked) {
          recipesHTML += `
            <div class="recipe-item recipe-unlocked">
              <span>${r.name} - $${r.price}</span>
              <small>Sold: ${r.timesSold}</small>
            </div>`;
        } else {
          recipesHTML += `
            <div class="recipe-item recipe-locked">
              <span>${r.name}</span>
              <button class="unlock-btn" onclick="unlockRecipe('${key}')">$${r.unlockCost}</button>
            </div>`;
        }
      }
      document.getElementById("recipes").innerHTML = recipesHTML;
      
      let ingHTML = "";
      const emoji = {
        chicken:"🐔", beef:"🥩", potato:"🥔", bun:"🍞", oil:"🛢️", 
        lettuce:"🥬", sausage:"🌭", flour:"🌾", dough:"🍞", 
        cheese:"🧀", tomato:"🍅", tortilla:"🌯"
      };
      
      for (let ing in ingredients) {
        if (ingredients[ing] > 0) {
          ingHTML += `<div class="ingredient-item">${emoji[ing] || ing}: ${ingredients[ing]}</div>`;
        }
      }
      document.getElementById("ingredients").innerHTML = ingHTML;
      
      document.getElementById("team").innerHTML = `
        <div class="team-member" style="background: linear-gradient(135deg, #ff6b35, #ff8c55);">
          <strong>👤 ${player.name}</strong>
          <span>Owner</span>
        </div>
        <div class="team-member" style="background: linear-gradient(135deg, #3498db, #5dade2);">
          <strong>👥 ${sibling.name}</strong>
          <span>Served: ${sibling.totalServed}</span>
        </div>
      `;
      
      const profit = totalEarned - (totalCustomersServed * 2);
      document.getElementById("stats").innerHTML = `
        <div class="ingredient-item">💵 Total Earned: $${Math.floor(totalEarned)}</div>
        <div class="ingredient-item">📈 Profit: $${Math.floor(profit)}</div>
        <div class="ingredient-item">⏱️ Playing: ${formatTime(gameTime)}</div>
        <div class="ingredient-item">🎯 In Queue: ${customers.length}</div>
        <div class="ingredient-item">🔥 Rush: ${rushHour ? 'ACTIVE!' : rushWarning ? 'INCOMING!' : formatTime(nextRushIn / 60)}</div>
      `;
      
      if (money >= 5000) {
        document.getElementById("upgradeBtn").style.display = "inline-block";
      }
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}m ${secs}s`;
    }

    function updateLog(msg) {
      document.getElementById("log").textContent = msg;
    }

    // ============================================
    // RECIPE UNLOCKING
    // ============================================
    window.unlockRecipe = function(recipeKey) {
      const recipe = recipes[recipeKey];
      if (!recipe.unlocked && money >= recipe.unlockCost) {
        money -= recipe.unlockCost;
        recipe.unlocked = true;
        
        for (let ing in recipe.ingredients) {
          if (ingredients[ing] === 0) {
            ingredients[ing] = 5;
          }
        }
        
        showAchievement(`🎉 Unlocked ${recipe.name}!`);
        updateLog(`🎉 Unlocked ${recipe.name}! Now serving!`);
      } else if (money < recipe.unlockCost) {
        updateLog(`❌ Need $${recipe.unlockCost} to unlock ${recipe.name}!`);
      }
    };

    // ============================================
    // ACHIEVEMENTS
    // ============================================
    function checkAchievements() {
      if (totalCustomersServed === 1) {
        showAchievement("🎊 First Customer!");
      } else if (totalCustomersServed === 10) {
        showAchievement("🔥 10 Customers Served!");
      } else if (totalCustomersServed === 50) {
        showAchievement("⭐ 50 Customers! You're a pro!");
      } else if (money >= 1000 && !achievementQueue.includes("💰 Made $1,000!")) {
        showAchievement("💰 Made $1,000!");
      }
    }

    function showAchievement(text) {
      if (achievementQueue.includes(text)) return;
      achievementQueue.push(text);
      
      const div = document.createElement("div");
      div.className = "achievement";
      div.textContent = text;
      document.body.appendChild(div);
      
      setTimeout(() => {
        div.remove();
      }, 3000);
    }

    // ============================================
    // BUTTONS
    // ============================================
    document.getElementById("buyIngredientsBtn").addEventListener("click", () => {
      if (money >= 50) {
        money -= 50;
        const commonIngs = ["chicken", "beef", "potato", "bun", "oil", "lettuce"];
        commonIngs.forEach(ing => {
          if (ingredients[ing] !== undefined) {
            ingredients[ing] += 8;
          }
        });
        updateLog("✅ Restocked ingredients!");
      } else {
        updateLog("❌ Need $50 to buy ingredients!");
      }
    });

    document.getElementById("upgradeBtn").addEventListener("click", () => {
      if (money >= 5000) {
        updateLog("🎉 Congratulations! 🎉 Restaurant phase coming soon! Keep building!");
        showAchievement("🏆 Ready for Restaurant!");
      }
    });

    // ============================================
    // EARNINGS CALCULATION
    // ============================================
    function calculateEarnings() {
      const now = Date.now();
      const elapsed = (now - lastEarningsUpdate) / 1000;
      
      if (elapsed >= 60) {
        if (gameTime > 0) {
          earningsPerMinute = Math.floor((totalEarned / gameTime) * 60);
        }
        lastEarningsUpdate = now;
      }
    }

    // ============================================
    // GAME LOOP
    // ============================================
    function loop() {
      try {
        movePlayer();
        updateSibling();
        updateRushHour();
        
        customers = customers.filter(c => c.update());
        customers = customers.filter(c => !c.isServed);
        
        draw();
        updateUI();
        
        gameTime += 1/60;
        calculateEarnings();
        
        requestAnimationFrame(loop);
      } catch (error) {
        console.error("Game error:", error);
        updateLog("⚠️ Error: " + error.message);
      }
    }

    // ============================================
    // START GAME
    // ============================================
    if (!canvas || !ctx) {
      alert("Canvas failed to load!");
    } else {
      console.log("🍔 Snack StacK ready!");
      loop();
    }
  </script>
</body>
</html>
