<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snack StacK - Food Truck Empire</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
* { margin:0; padding:0; box-sizing:border-box; image-rendering:pixelated; }
body { background-color:#1a1a2e; background-image:repeating-linear-gradient(0deg,transparent,transparent 31px,#16213e 31px,#16213e 32px),repeating-linear-gradient(90deg,transparent,transparent 31px,#16213e 31px,#16213e 32px); font-family:'Press Start 2P',monospace; text-align:center; padding:20px; min-height:100vh; color:#e8e8e8; }
h1 { font-size:28px; margin:10px 0; color:#ff6b35; text-shadow:4px 4px 0px #7a2e00,-2px -2px 0px #000; letter-spacing:4px; }
.stats { display:flex; justify-content:center; gap:20px; margin:20px 0; flex-wrap:wrap; }
.stat-item { background:#0f3460; padding:12px 18px; border:4px solid #e8e8e8; box-shadow:4px 4px 0px #000; font-size:11px; }
#money{color:#2ecc71;} #earnings{color:#3498db;} #customers-count{color:#e91e63;}
canvas { display:block; margin:15px auto; border:6px solid #e8e8e8; box-shadow:8px 8px 0px #000; cursor:crosshair; max-width:100%; }
.game-panels { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; max-width:1200px; margin:20px auto; padding:0 10px; }
.panel { background:#0f3460; border:4px solid #e8e8e8; box-shadow:6px 6px 0px #000; padding:16px; text-align:left; }
.panel h3 { margin:0 0 14px 0; color:#ff6b35; font-size:11px; text-align:center; border-bottom:4px solid #ff6b35; padding-bottom:10px; letter-spacing:2px; }
.panel-content { max-height:200px; overflow-y:auto; }
.panel-content::-webkit-scrollbar{width:8px;} .panel-content::-webkit-scrollbar-track{background:#1a1a2e;} .panel-content::-webkit-scrollbar-thumb{background:#ff6b35;border:2px solid #000;}
.recipe-item,.ingredient-item,.team-member { margin:8px 0; padding:8px; font-size:9px; display:flex; justify-content:space-between; align-items:center; border:3px solid #e8e8e8; background:#16213e; line-height:1.6; }
.recipe-unlocked{border-color:#2ecc71;color:#2ecc71;} .recipe-locked{border-color:#555;color:#555;}
.unlock-btn { padding:6px 10px; font-size:8px; font-family:'Press Start 2P',monospace; background:#ff6b35; border:3px solid #e8e8e8; box-shadow:3px 3px 0px #000; cursor:pointer; color:#fff; transition:none; }
.unlock-btn:hover { background:#ffcd38; color:#000; transform:translate(2px,2px); box-shadow:1px 1px 0px #000; }
.controls { margin:20px 0; display:flex; justify-content:center; gap:16px; flex-wrap:wrap; }
button { padding:14px 24px; font-size:11px; font-family:'Press Start 2P',monospace; border:4px solid #e8e8e8; box-shadow:6px 6px 0px #000; cursor:pointer; font-weight:normal; transition:none; text-transform:uppercase; letter-spacing:1px; }
button:hover{transform:translate(3px,3px);box-shadow:3px 3px 0px #000;} button:active{transform:translate(6px,6px);box-shadow:none;}
#buyIngredientsBtn{background:#0f3460;color:#3498db;border-color:#3498db;}
#upgradeBtn{background:#0f3460;color:#ffcd38;border-color:#ffcd38;animation:blink 1s step-end infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.4;}}
#log { margin:20px auto; font-size:11px; color:#e8e8e8; background:#0f3460; padding:16px 20px; max-width:900px; border:4px solid #e8e8e8; box-shadow:6px 6px 0px #000; min-height:55px; display:flex; align-items:center; justify-content:center; line-height:2; }
.controls-hint { background:#0f3460; color:#2ecc71; padding:12px; border:4px solid #2ecc71; box-shadow:4px 4px 0px #000; margin:10px auto; max-width:900px; font-size:9px; line-height:2; }
.achievement { position:fixed; top:20px; right:20px; background:#ffcd38; color:#000; padding:16px 24px; font-size:11px; border:4px solid #000; box-shadow:6px 6px 0px #000; animation:slideIn 0.1s steps(1),slideOut 0.1s steps(1) 2.5s; z-index:1000; font-family:'Press Start 2P',monospace; line-height:2; }
@keyframes slideIn{from{transform:translateX(400px);}to{transform:translateX(0);}}
@keyframes slideOut{from{transform:translateX(0);opacity:1;}to{transform:translateX(400px);opacity:0;}}
  </style>
</head>
<body>
  <h1>🍔 SNACK STACK 🍟</h1>
  <div class="stats">
    <div class="stat-item" id="money">💰 Money: $100</div>
    <div class="stat-item" id="earnings">📈 $/min: $0</div>
    <div class="stat-item" id="customers-count">👥 Served: 0</div>
  </div>
  <canvas id="game"></canvas>
  <div class="controls-hint">WASD Move &nbsp;|&nbsp; E Interact / Serve &nbsp;|&nbsp; Q Drop food &nbsp;|&nbsp; Walk to a station + E to start cooking &nbsp;|&nbsp; Pick up when done, bring to SERVE counter!</div>
  <div class="game-panels">
    <div class="panel"><h3>📋 Recipes</h3><div id="recipes" class="panel-content"></div></div>
    <div class="panel"><h3>🥡 Inventory</h3><div id="ingredients" class="panel-content"></div></div>
    <div class="panel"><h3>👥 Your Team</h3><div id="team" class="panel-content"></div></div>
    <div class="panel"><h3>📊 Statistics</h3><div id="stats" class="panel-content"></div></div>
  </div>
  <div class="controls">
    <button id="buyIngredientsBtn">🛒 Buy Ingredients ($50)</button>
    <button id="upgradeBtn" style="display:none;">⭐ Open Restaurant! ($5,000)</button>
  </div>
  <div id="log">Walk to a station and press E to start cooking! 🍳</div>

<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  canvas.width = 900; canvas.height = 550;
  canvas.style.width = Math.min(900, window.innerWidth - 40) + "px";

  let money = 100, totalEarned = 0, totalCustomersServed = 0;
  let gameTime = 0, customers = [], nextCustomerId = 0;
  let earningsPerMinute = 0, lastEarningsUpdate = Date.now();
  let achievementQueue = [];

  // ============================================
  // RUSH HOUR
  // ============================================
  let rushHour=false,rushTimer=0,rushWarning=false,rushWarningTimer=0,nextRushIn=1800,rushBonus=0;
  function updateRushHour(){
    if(rushWarning){rushWarningTimer++;if(rushWarningTimer>180){rushWarning=false;rushHour=true;rushTimer=0;rushBonus=0;updateLog("🔥 RUSH HOUR! Double tips!");}return;}
    if(rushHour){rushTimer++;if(rushTimer>3600){rushHour=false;nextRushIn=1800;money+=rushBonus;showAchievement(`⭐ Rush Over! +$${rushBonus}!`);updateLog(`✅ Rush over! +$${rushBonus} bonus!`);}return;}
    nextRushIn--;if(nextRushIn<=0){rushWarning=true;rushWarningTimer=0;updateLog("⚠️ RUSH HOUR INCOMING!");}
  }
  function drawRushHour(){
    if(rushWarning){ctx.fillStyle=`rgba(255,200,0,${0.2+0.15*Math.sin(Date.now()/100)})`;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#fff";ctx.font="bold 28px Arial";ctx.textAlign="center";ctx.fillText("⚠️ RUSH HOUR INCOMING! ⚠️",canvas.width/2,50);ctx.textAlign="left";}
    if(rushHour){ctx.fillStyle="rgba(255,50,0,0.07)";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#ff4444";ctx.font="bold 18px Arial";ctx.textAlign="center";ctx.fillText(`🔥 RUSH HOUR - ${Math.ceil((3600-rushTimer)/60)}s | Bonus: $${rushBonus}`,canvas.width/2,28);ctx.textAlign="left";}
  }

  // ============================================
  // STATIONS
  // ============================================
  const SS = 52; // station size
  const stations = [
    {id:"prep",   label:"PREP",  emoji:"🔪",x:30, y:60, color:"#8e44ad",cookTime:150,burnTime:300,food:null,cookTimer:0,state:"idle"},
    {id:"grill",  label:"GRILL", emoji:"🔥",x:110,y:60, color:"#c0392b",cookTime:200,burnTime:350,food:null,cookTimer:0,state:"idle"},
    {id:"fryer",  label:"FRYER", emoji:"🛢️",x:190,y:60, color:"#e67e22",cookTime:180,burnTime:320,food:null,cookTimer:0,state:"idle"},
    {id:"counter",label:"SERVE", emoji:"🍽️",x:650,y:60, color:"#27ae60",cookTime:0,  burnTime:9999,food:null,cookTimer:0,state:"idle"},
  ];

  const recipePipeline = {
    burger: ["prep","grill","counter"],
    fries:  ["fryer","counter"],
    hotdog: ["grill","counter"],
    tenders:["prep","fryer","counter"],
    pizza:  ["prep","grill","counter"],
    taco:   ["prep","counter"],
  };

  const recipes = {
    burger: {name:"🍔 Burger",        unlocked:true, ingredients:{beef:1,bun:1,lettuce:1},   price:10,cost:4,timesSold:0},
    fries:  {name:"🍟 Fries",          unlocked:true, ingredients:{potato:2,oil:1},           price:6, cost:2,timesSold:0},
    hotdog: {name:"🌭 Hot Dog",        unlocked:false,ingredients:{sausage:1,bun:1},          price:8, cost:3,unlockCost:250,timesSold:0},
    tenders:{name:"🍗 Chicken Tenders",unlocked:false,ingredients:{chicken:2,flour:1,oil:1},  price:12,cost:5,unlockCost:400,timesSold:0},
    pizza:  {name:"🍕 Pizza Slice",    unlocked:false,ingredients:{dough:1,cheese:1,tomato:1},price:15,cost:6,unlockCost:800,timesSold:0},
    taco:   {name:"🌮 Taco",           unlocked:false,ingredients:{beef:1,tortilla:1,lettuce:1,cheese:1},price:9,cost:4,unlockCost:600,timesSold:0},
  };

  let ingredients = {beef:15,chicken:10,potato:20,bun:15,oil:10,lettuce:10,sausage:0,flour:0,dough:0,cheese:0,tomato:0,tortilla:0};

  function hasIngredients(rk){const r=recipes[rk];for(let i in r.ingredients)if(ingredients[i]<r.ingredients[i])return false;return true;}
  function useIngredients(rk){const r=recipes[rk];for(let i in r.ingredients)ingredients[i]-=r.ingredients[i];}
  function stationCenter(s){return{x:s.x+SS/2,y:s.y+SS/2};}
  function distToStation(char,s){const c=stationCenter(s);return Math.hypot(char.x+char.size/2-c.x,char.y+char.size/2-c.y);}

  // ============================================
  // PLAYER
  // ============================================
  const player = {x:300,y:350,size:30,speed:4,color:"#ff6b35",name:"You",holding:null};

  // ============================================
  // SIBLING
  // ============================================
  const sibling = {x:400,y:350,size:30,speed:2.5,color:"#3498db",name:"Sibling",holding:null,aiTimer:0,totalServed:0};

  // ============================================
  // INPUT
  // ============================================
  const keys={};
  document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;
    if(e.key.toLowerCase()==="e") handleInteract(player);
    if(e.key.toLowerCase()==="q") handleDrop(player);
  });
  document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

  function handleInteract(char){
    // Try to serve a customer if near the counter and counter has matching food
    const counter=stations.find(s=>s.id==="counter");
    for(let c of customers){
      if(!c.waiting||c.isServed)continue;
      if(Math.hypot(char.x-c.x,char.y-c.y)<130){
        if(counter.food&&counter.food.recipeKey===c.recipe&&!counter.food.burned){
          serveCustomer(c,counter);return;
        }
      }
    }

    // Find nearest station
    let best=null,bestD=80;
    for(let s of stations){const d=distToStation(char,s);if(d<bestD){best=s;bestD=d;}}
    if(!best)return;

    if(best.id==="counter"){
      // Place held food on counter
      if(char.holding&&!counter.food){
        const pipeline=recipePipeline[char.holding.recipeKey];
        if(char.holding.stage===pipeline.length-1){
          counter.food={...char.holding};counter.state="ready";char.holding=null;
          updateLog("🍽️ Food on counter! Walk to a customer and press E.");
        }else{updateLog("❌ Not ready to serve yet!");}
      }else if(counter.food&&!char.holding){
        char.holding={...counter.food};counter.food=null;counter.state="idle";
        updateLog("📦 Picked up from counter.");
      }
      return;
    }

    // Non-counter station
    if(best.state==="idle"&&!best.food){
      if(char.holding){
        // Place held food to cook next step
        const pipeline=recipePipeline[char.holding.recipeKey];
        const nextIdx=char.holding.stage+1;
        if(nextIdx<pipeline.length&&pipeline[nextIdx]===best.id){
          best.food={...char.holding};best.food.stage=nextIdx;best.cookTimer=0;best.state="cooking";
          char.holding=null;updateLog(`🍳 Cooking step ${nextIdx+1} on ${best.label}...`);
        }else{
          const needed=pipeline[nextIdx]||"SERVE";
          updateLog(`❌ Wrong station! Take to ${needed.toUpperCase()} next.`);
        }
      }else{
        // Start a new dish
        const candidates=Object.keys(recipes).filter(k=>recipes[k].unlocked&&recipePipeline[k][0]===best.id&&hasIngredients(k));
        if(!candidates.length){updateLog(`❌ No recipes for ${best.label} or missing ingredients!`);return;}
        const rk=candidates[0];useIngredients(rk);
        best.food={recipeKey:rk,stage:0,burned:false};best.cookTimer=0;best.state="cooking";
        updateLog(`🍳 Started ${recipes[rk].name}! Don't let it burn!`);
      }
    }else if(best.state==="ready"){
      if(!char.holding){
        char.holding={...best.food};best.food=null;best.state="idle";best.cookTimer=0;
        const pipeline=recipePipeline[char.holding.recipeKey];
        const next=pipeline[char.holding.stage+1];
        updateLog(next?`➡️ Next: take to ${next.toUpperCase()}`:`✅ Done! Bring to SERVE counter.`);
      }else{updateLog("❌ Hands full! Press Q to drop.");}
    }else if(best.state==="burned"){
      best.food=null;best.state="idle";best.cookTimer=0;updateLog("🗑️ Cleared burned food.");
    }else if(best.state==="cooking"){
      const pct=Math.floor(best.cookTimer/best.cookTime*100);
      updateLog(`⏳ ${best.label} cooking... ${Math.min(pct,100)}%`);
    }
  }

  function handleDrop(char){
    if(!char.holding){return;}
    char.holding=null;updateLog("🗑️ Dropped food.");
  }

  function serveCustomer(customer,counter){
    const recipe=recipes[customer.recipe];
    const tip=Math.floor(recipe.price*customer.patience*(rushHour?0.6:0.3));
    const total=recipe.price+tip;
    money+=total;totalEarned+=total;totalCustomersServed++;recipe.timesSold++;
    customer.isServed=true;counter.food=null;counter.state="idle";
    if(rushHour)rushBonus+=tip;
    updateLog(`✅ Served ${recipe.name} $${recipe.price}${tip>0?` + $${tip} tip`:""}!${rushHour?" 🔥":""}`);
    checkAchievements();
    setTimeout(()=>{customers=customers.filter(c=>c.id!==customer.id);},300);
  }

  // ============================================
  // UPDATE STATIONS
  // ============================================
  function updateStations(){
    for(let s of stations){
      if(s.state!=="cooking")continue;
      s.cookTimer++;
      if(s.cookTimer>=s.cookTime+s.burnTime){
        s.state="burned";if(s.food)s.food.burned=true;
        updateLog(`🔥 ${recipes[s.food.recipeKey].name} BURNED on ${s.label}! Press E to clear.`);
      }else if(s.cookTimer>=s.cookTime&&s.state==="cooking"){
        s.state="ready";
      }
    }
  }

  // ============================================
  // SIBLING AI
  // ============================================
  function updateSiblingAI(){
    sibling.aiTimer++;
    if(sibling.aiTimer<45)return;
    sibling.aiTimer=0;

    const counter=stations.find(s=>s.id==="counter");

    // If holding: go to next station or counter
    if(sibling.holding){
      const pipeline=recipePipeline[sibling.holding.recipeKey];
      const nextIdx=sibling.holding.stage+1;
      if(nextIdx>=pipeline.length){
        // deliver to counter
        if(!counter.food){
          if(distToStation(sibling,counter)<65){counter.food={...sibling.holding};counter.state="ready";sibling.holding=null;}
          else moveTo(sibling,stationCenter(counter));
        }
      }else{
        const ns=stations.find(s=>s.id===pipeline[nextIdx]);
        if(ns&&ns.state==="idle"&&!ns.food){
          if(distToStation(sibling,ns)<65){ns.food={...sibling.holding};ns.food.stage=nextIdx;ns.cookTimer=0;ns.state="cooking";sibling.holding=null;}
          else moveTo(sibling,stationCenter(ns));
        }
      }
      return;
    }

    // Pick up ready food
    for(let s of stations){
      if(s.state==="ready"&&s.id!=="counter"){
        if(distToStation(sibling,s)<65){sibling.holding={...s.food};s.food=null;s.state="idle";s.cookTimer=0;}
        else moveTo(sibling,stationCenter(s));
        return;
      }
    }

    // Serve customer if counter has food
    if(counter.food&&!counter.food.burned){
      for(let c of customers){
        if(c.waiting&&!c.isServed&&counter.food.recipeKey===c.recipe){
          if(Math.hypot(sibling.x-c.x,sibling.y-c.y)<80){serveCustomer(c,counter);sibling.totalServed++;}
          else moveTo(sibling,{x:c.x,y:c.y});
          return;
        }
      }
    }

    // Clear burned food
    for(let s of stations){
      if(s.state==="burned"){
        if(distToStation(sibling,s)<65){s.food=null;s.state="idle";s.cookTimer=0;}
        else moveTo(sibling,stationCenter(s));
        return;
      }
    }

    // Start cooking at idle station
    for(let s of stations){
      if(s.state==="idle"&&!s.food&&s.id!=="counter"){
        const cands=Object.keys(recipes).filter(k=>recipes[k].unlocked&&recipePipeline[k][0]===s.id&&hasIngredients(k));
        if(cands.length){
          if(distToStation(sibling,s)<65){useIngredients(cands[0]);s.food={recipeKey:cands[0],stage:0,burned:false};s.cookTimer=0;s.state="cooking";}
          else moveTo(sibling,stationCenter(s));
          return;
        }
      }
    }

    moveTo(sibling,{x:500,y:350});
  }

  function moveTo(char,pos){
    const angle=Math.atan2(pos.y-char.y,pos.x-char.x);
    char.x+=Math.cos(angle)*char.speed;
    char.y+=Math.sin(angle)*char.speed;
  }

  // ============================================
  // CUSTOMERS
  // ============================================
  class Customer{
    constructor(recipe){
      this.id=nextCustomerId++;this.recipe=recipe;
      this.x=-50;this.y=180;
      this.size=30;this.speed=1+Math.random()*0.5;
      const waiting=customers.filter(c=>c.waiting).length;
      this.targetX=Math.min(760-waiting*38,760);
      this.waiting=false;this.waitTimer=0;
      this.maxWaitTime=rushHour?200:320;
      this.color=["#9b59b6","#e67e22","#1abc9c","#e91e63"][Math.floor(Math.random()*4)];
      this.isServed=false;this.patience=1.0;
    }
    update(){
      if(!this.waiting){if(this.x<this.targetX)this.x+=this.speed;else this.waiting=true;}
      else{
        this.waitTimer++;this.patience=1-(this.waitTimer/this.maxWaitTime);
        if(this.waitTimer>this.maxWaitTime&&!this.isServed){this.leave();return false;}
      }
      return true;
    }
    leave(){if(!this.isServed)updateLog("😞 Customer left hungry!");}
    draw(){
      ctx.fillStyle=this.color;ctx.fillRect(this.x,this.y,this.size,this.size);
      ctx.fillStyle="#fff";ctx.fillRect(this.x+7,this.y+8,7,7);ctx.fillRect(this.x+16,this.y+8,7,7);
      if(this.waiting){
        ctx.fillStyle="rgba(255,255,255,0.95)";ctx.beginPath();ctx.arc(this.x+15,this.y-22,18,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle="#333";ctx.lineWidth=2;ctx.stroke();
        ctx.font="18px Arial";ctx.fillStyle="#333";
        ctx.fillText(recipes[this.recipe].name.split(" ")[0],this.x-1,this.y-15);
        const bw=35,bh=6,fw=this.patience*bw;
        const g=ctx.createLinearGradient(this.x,0,this.x+bw,0);
        if(this.patience>0.6){g.addColorStop(0,"#2ecc71");g.addColorStop(1,"#27ae60");}
        else if(this.patience>0.3){g.addColorStop(0,"#f39c12");g.addColorStop(1,"#e67e22");}
        else{g.addColorStop(0,"#e74c3c");g.addColorStop(1,"#c0392b");}
        ctx.fillStyle=g;ctx.fillRect(this.x,this.y-38,fw,bh);
        ctx.strokeStyle="#2c3e50";ctx.lineWidth=2;ctx.strokeRect(this.x,this.y-38,bw,bh);

        // Highlight if player near and counter has their food
        const counter=stations.find(s=>s.id==="counter");
        const canServe=counter.food&&counter.food.recipeKey===this.recipe&&!counter.food.burned;
        if(Math.hypot(player.x-this.x,player.y-this.y)<130){
          ctx.fillStyle=canServe?"rgba(46,204,113,0.9)":"rgba(180,30,30,0.8)";
          ctx.fillRect(this.x-10,this.y-58,canServe?90:120,16);
          ctx.fillStyle="#fff";ctx.font="bold 9px Arial";
          ctx.fillText(canServe?"E to Serve!":"Need: "+recipes[this.recipe].name.split(" ")[0],this.x-6,this.y-46);
        }
      }
    }
  }

  function spawnCustomer(){
    const avail=Object.keys(recipes).filter(r=>recipes[r].unlocked);
    if(!avail.length)return;
    const weights=avail.map(r=>recipes[r].price),total=weights.reduce((a,b)=>a+b,0);
    let rand=Math.random()*total,sel=avail[0];
    for(let i=0;i<avail.length;i++){rand-=weights[i];if(rand<=0){sel=avail[i];break;}}
    customers.push(new Customer(sel));
  }

  setInterval(()=>{
    const chance=rushHour?0.75:0.35,max=rushHour?8:5;
    if(Math.random()<chance&&customers.length<max)spawnCustomer();
  },1500);

  // ============================================
  // PLAYER MOVEMENT
  // ============================================
  function movePlayer(){
    if(keys["w"]||keys["arrowup"])   player.y-=player.speed;
    if(keys["s"]||keys["arrowdown"]) player.y+=player.speed;
    if(keys["a"]||keys["arrowleft"]) player.x-=player.speed;
    if(keys["d"]||keys["arrowright"])player.x+=player.speed;
    player.x=Math.max(0,Math.min(canvas.width-player.size,player.x));
    player.y=Math.max(0,Math.min(canvas.height-player.size,player.y));
  }

  // ============================================
  // DRAW
  // ============================================
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Kitchen floor
    ctx.fillStyle="#d4a96a";ctx.fillRect(0,0,canvas.width,canvas.height);
    for(let x=0;x<canvas.width;x+=48)for(let y=0;y<canvas.height;y+=48){
      ctx.strokeStyle="rgba(0,0,0,0.08)";ctx.lineWidth=1;ctx.strokeRect(x,y,48,48);
    }
    // Counter top strip
    ctx.fillStyle="#5a3510";ctx.fillRect(0,0,canvas.width,145);
    ctx.fillStyle="#7a4a20";ctx.fillRect(0,130,canvas.width,18);

    drawStations();
    customers.forEach(c=>c.draw());
    drawCharacter(sibling,"SIB",sibling.holding);
    drawCharacter(player,"YOU",player.holding);
    drawHUD();
    drawRushHour();
  }

  function drawStations(){
    for(let s of stations){
      let col=s.color;
      if(s.state==="burned")col="#1a1a1a";
      else if(s.state==="ready")col="#1e8449";

      // Shadow
      ctx.fillStyle="rgba(0,0,0,0.3)";ctx.fillRect(s.x+4,s.y+4,SS,SS);
      // Body
      ctx.fillStyle=col;ctx.fillRect(s.x,s.y,SS,SS);
      ctx.strokeStyle="#000";ctx.lineWidth=3;ctx.strokeRect(s.x,s.y,SS,SS);

      // Emoji + label
      ctx.font="22px Arial";ctx.textAlign="center";
      ctx.fillText(s.emoji,s.x+SS/2,s.y+28);
      ctx.fillStyle="#fff";ctx.font="bold 7px Arial";
      ctx.fillText(s.label,s.x+SS/2,s.y+SS-5);
      ctx.textAlign="left";

      // Cook progress bar
      if(s.state==="cooking"&&s.cookTime>0){
        const prog=Math.min(s.cookTimer/s.cookTime,1);
        const burnProg=s.cookTimer>s.cookTime?(s.cookTimer-s.cookTime)/s.burnTime:0;
        const bw=SS-4,bh=7;
        ctx.fillStyle="#333";ctx.fillRect(s.x+2,s.y+SS+3,bw,bh);
        ctx.fillStyle=burnProg>0?"#e74c3c":"#2ecc71";
        ctx.fillRect(s.x+2,s.y+SS+3,bw*(burnProg>0?1-burnProg:prog),bh);
        ctx.strokeStyle="#000";ctx.lineWidth=1;ctx.strokeRect(s.x+2,s.y+SS+3,bw,bh);
        // burn countdown shrinks from right
        if(burnProg>0){
          ctx.fillStyle="rgba(231,76,60,0.5)";
          ctx.fillRect(s.x+2+bw*(1-burnProg),s.y+SS+3,bw*burnProg,bh);
        }
      }

      // Status icon
      if(s.state==="ready"){ctx.font="16px Arial";ctx.textAlign="center";ctx.fillText("✅",s.x+SS/2,s.y-4);ctx.textAlign="left";}
      if(s.state==="burned"){ctx.font="16px Arial";ctx.textAlign="center";ctx.fillText("💀",s.x+SS/2,s.y-4);ctx.textAlign="left";}

      // Food on station
      if(s.food){
        ctx.font="16px Arial";ctx.textAlign="center";
        ctx.fillText(s.food.burned?"🖤":recipes[s.food.recipeKey].name.split(" ")[0],s.x+SS/2,s.y+14);
        ctx.textAlign="left";
      }

      // Highlight if player near
      if(distToStation(player,s)<80){
        ctx.strokeStyle="#ffcd38";ctx.lineWidth=4;ctx.strokeRect(s.x-3,s.y-3,SS+6,SS+6);
        ctx.fillStyle="#ffcd38";ctx.font="bold 9px Arial";ctx.textAlign="center";
        ctx.fillText("[E]",s.x+SS/2,s.y+SS+18);ctx.textAlign="left";
      }
    }
  }

  function drawCharacter(char,label,holding){
    ctx.fillStyle=char.color;ctx.fillRect(char.x,char.y,char.size,char.size);
    ctx.fillStyle="#fff";ctx.fillRect(char.x+7,char.y+8,7,7);ctx.fillRect(char.x+16,char.y+8,7,7);
    ctx.fillStyle="#fff";ctx.font="bold 10px Arial";ctx.strokeStyle="#000";ctx.lineWidth=3;
    ctx.strokeText(label,char.x+2,char.y+22);ctx.fillText(label,char.x+2,char.y+22);
    if(holding){
      ctx.font="18px Arial";
      ctx.fillText(holding.burned?"🖤":recipes[holding.recipeKey].name.split(" ")[0],char.x+char.size,char.y-2);
    }
  }

  function drawHUD(){
    // Holding bar
    ctx.fillStyle="rgba(0,0,0,0.75)";ctx.fillRect(8,canvas.height-48,240,38);
    ctx.strokeStyle="#e8e8e8";ctx.lineWidth=2;ctx.strokeRect(8,canvas.height-48,240,38);
    ctx.fillStyle="#e8e8e8";ctx.font="bold 10px Arial";
    if(player.holding){
      const r=recipes[player.holding.recipeKey];
      const pipeline=recipePipeline[player.holding.recipeKey];
      const next=pipeline[player.holding.stage+1]||"SERVE";
      ctx.fillText(`${r.name.split(" ")[0]} → ${next.toUpperCase()}`,14,canvas.height-22);
    }else{
      ctx.fillStyle="#aaa";ctx.fillText("Hands empty",14,canvas.height-22);
    }
  }

  // ============================================
  // UI
  // ============================================
  function updateUI(){
    document.getElementById("money").textContent=`💰 Money: $${Math.floor(money)}`;
    document.getElementById("earnings").textContent=`📈 $/min: $${earningsPerMinute}`;
    document.getElementById("customers-count").textContent=`👥 Served: ${totalCustomersServed}`;

    let rHTML="";
    for(let key in recipes){
      const r=recipes[key],pipe=recipePipeline[key].map(s=>s.toUpperCase()).join("→");
      if(r.unlocked)rHTML+=`<div class="recipe-item recipe-unlocked"><span>${r.name} $${r.price}</span><small>${pipe}</small></div>`;
      else rHTML+=`<div class="recipe-item recipe-locked"><span>${r.name}</span><button class="unlock-btn" onclick="unlockRecipe('${key}')">$${r.unlockCost}</button></div>`;
    }
    document.getElementById("recipes").innerHTML=rHTML;

    const emoji={chicken:"🐔",beef:"🥩",potato:"🥔",bun:"🍞",oil:"🛢️",lettuce:"🥬",sausage:"🌭",flour:"🌾",dough:"🍞",cheese:"🧀",tomato:"🍅",tortilla:"🌯"};
    document.getElementById("ingredients").innerHTML=Object.keys(ingredients).filter(k=>ingredients[k]>0).map(k=>`<div class="ingredient-item">${emoji[k]||k}: ${ingredients[k]}</div>`).join("");

    document.getElementById("team").innerHTML=`
      <div class="team-member" style="background:linear-gradient(135deg,#ff6b35,#ff8c55)"><strong>👤 You</strong><span>Owner</span></div>
      <div class="team-member" style="background:linear-gradient(135deg,#3498db,#5dade2)"><strong>👥 Sibling</strong><span>Served: ${sibling.totalServed}</span></div>`;

    const profit=totalEarned-(totalCustomersServed*2);
    document.getElementById("stats").innerHTML=`
      <div class="ingredient-item">💵 Total: $${Math.floor(totalEarned)}</div>
      <div class="ingredient-item">📈 Profit: $${Math.floor(profit)}</div>
      <div class="ingredient-item">⏱️ Time: ${formatTime(gameTime)}</div>
      <div class="ingredient-item">🎯 Queue: ${customers.length}</div>
      <div class="ingredient-item">🔥 Rush: ${rushHour?"ACTIVE!":rushWarning?"INCOMING!":formatTime(nextRushIn/60)}</div>`;

    if(money>=5000)document.getElementById("upgradeBtn").style.display="inline-block";
  }

  function formatTime(s){return`${Math.floor(s/60)}m ${Math.floor(s%60)}s`;}
  function updateLog(msg){document.getElementById("log").textContent=msg;}

  window.unlockRecipe=function(key){
    const r=recipes[key];
    if(!r.unlocked&&money>=r.unlockCost){money-=r.unlockCost;r.unlocked=true;for(let i in r.ingredients)if(ingredients[i]===0)ingredients[i]=5;showAchievement(`🎉 Unlocked ${r.name}!`);updateLog(`🎉 Unlocked ${r.name}!`);}
    else if(money<r.unlockCost)updateLog(`❌ Need $${r.unlockCost}!`);
  };

  function checkAchievements(){
    if(totalCustomersServed===1)showAchievement("🎊 First Customer!");
    else if(totalCustomersServed===10)showAchievement("🔥 10 Served!");
    else if(totalCustomersServed===50)showAchievement("⭐ 50 Customers!");
    else if(money>=1000&&!achievementQueue.includes("💰 $1,000!"))showAchievement("💰 $1,000!");
  }

  function showAchievement(text){
    if(achievementQueue.includes(text))return;achievementQueue.push(text);
    const div=document.createElement("div");div.className="achievement";div.textContent=text;
    document.body.appendChild(div);setTimeout(()=>div.remove(),3000);
  }

  document.getElementById("buyIngredientsBtn").addEventListener("click",()=>{
    if(money>=50){money-=50;["chicken","beef","potato","bun","oil","lettuce"].forEach(i=>{if(ingredients[i]!==undefined)ingredients[i]+=8;});updateLog("✅ Restocked!");}
    else updateLog("❌ Need $50!");
  });
  document.getElementById("upgradeBtn").addEventListener("click",()=>{if(money>=5000){updateLog("🎉 Restaurant coming soon!");showAchievement("🏆 Ready for Restaurant!");}});

  function calculateEarnings(){
    const now=Date.now(),elapsed=(now-lastEarningsUpdate)/1000;
    if(elapsed>=60){if(gameTime>0)earningsPerMinute=Math.floor((totalEarned/gameTime)*60);lastEarningsUpdate=now;}
  }

  // ============================================
  // GAME LOOP
  // ============================================
  function loop(){
    try{
      movePlayer();updateSiblingAI();updateStations();updateRushHour();
      customers=customers.filter(c=>c.update());
      customers=customers.filter(c=>!c.isServed);
      draw();updateUI();
      gameTime+=1/60;calculateEarnings();
      requestAnimationFrame(loop);
    }catch(e){console.error(e);updateLog("⚠️ Error: "+e.message);}
  }

  if(!canvas||!ctx)alert("Canvas failed!");
  else{console.log("🍔 Snack StacK ready!");loop();}
</script>
</body>
