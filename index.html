<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snack StacK - Food Truck Empire</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to bottom, #87CEEB 0%, #ffe8b0 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      font-size: 52px;
      margin: 10px 0;
      color: #ff6b35;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
      letter-spacing: 2px;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 15px 0;
      font-size: 22px;
      font-weight: bold;
      flex-wrap: wrap;
    }

    .stat-item {
      background: rgba(255,255,255,0.9);
      padding: 10px 20px;
      border-radius: 15px;
      border: 3px solid #333;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    #money {
      color: #27ae60;
    }

    #earnings {
      color: #2980b9;
    }

    #customers-count {
      color: #8e44ad;
    }

    canvas {
      background: linear-gradient(to bottom, #87CEEB 0%, #90EE90 70%, #8B7355 100%);
      display: block;
      margin: 15px auto;
      border: 6px solid #2c3e50;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      cursor: crosshair;
    }

    .game-panels {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 10px;
    }

    .panel {
      background: white;
      border: 4px solid #2c3e50;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
      text-align: left;
    }

    .panel h3 {
      margin: 0 0 15px 0;
      color: #2c3e50;
      font-size: 22px;
      text-align: center;
      border-bottom: 3px solid #3498db;
      padding-bottom: 10px;
    }

    .panel-content {
      max-height: 250px;
      overflow-y: auto;
    }

    .recipe-item, .ingredient-item, .team-member {
      margin: 10px 0;
      padding: 10px;
      background: #ecf0f1;
      border-radius: 8px;
      font-size: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .recipe-unlocked {
      background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
      border-left: 4px solid #28a745;
      font-weight: bold;
    }

    .recipe-locked {
      opacity: 0.6;
      background: #f8d7da;
      border-left: 4px solid #dc3545;
    }

    .unlock-btn {
      padding: 5px 15px;
      font-size: 14px;
      background: #ffc107;
      border: 2px solid #333;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .unlock-btn:hover {
      transform: scale(1.05);
      background: #ffcd38;
    }

    .controls {
      margin: 25px 0;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    button {
      padding: 18px 35px;
      font-size: 19px;
      border: 4px solid #2c3e50;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }

    button:active {
      transform: translateY(0);
    }

    #buyIngredientsBtn {
      background: linear-gradient(135deg, #3498db, #2980b9);
      color: white;
    }

    #upgradeBtn {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: white;
      font-size: 22px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    #saveBtn, #resetBtn {
      background: linear-gradient(135deg, #95a5a6, #7f8c8d);
      color: white;
      font-size: 16px;
      padding: 12px 25px;
    }

    #log {
      margin: 25px auto;
      font-size: 20px;
      color: #2c3e50;
      background: rgba(255,255,255,0.95);
      padding: 20px;
      border-radius: 15px;
      max-width: 900px;
      border: 3px solid #34495e;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .controls-hint {
      background: rgba(52, 152, 219, 0.9);
      color: white;
      padding: 15px;
      border-radius: 10px;
      margin: 10px auto;
      max-width: 700px;
      font-size: 18px;
      font-weight: bold;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #ecf0f1;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 5px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3498db, #2ecc71);
      transition: width 0.3s;
    }

    .achievement {
      position: fixed;
      top: 20px;
      right: 20px;
      background: linear-gradient(135deg, #f39c12, #e67e22);
      color: white;
      padding: 20px 30px;
      border-radius: 15px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      animation: slideIn 0.5s, slideOut 0.5s 2.5s;
      z-index: 1000;
    }

    @keyframes slideIn {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes slideOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(400px); opacity: 0; }
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #ecf0f1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: #3498db;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #2980b9;
    }
  </style>
</head>
<body>
  <h1>🍔 SNACK STACK 🍟</h1>
  
  <div class="stats">
    <div class="stat-item" id="money">💰 Money: $100</div>
    <div class="stat-item" id="earnings">📈 $/min: $0</div>
    <div class="stat-item" id="customers-count">👥 Served: 0</div>
  </div>
  
  <canvas id="game"></canvas>
  
  <div class="controls-hint">
    🎮 WASD to Move • E to Serve Customers • Your Sibling Helps Automatically!
  </div>
  
  <div class="game-panels">
    <div class="panel">
      <h3>📋 Recipes</h3>
      <div id="recipes" class="panel-content"></div>
    </div>
    
    <div class="panel">
      <h3>🥡 Inventory</h3>
      <div id="ingredients" class="panel-content"></div>
      <div style="margin-top: 15px; text-align: center;">
        <div class="progress-bar">
          <div class="progress-fill" id="storage-progress" style="width: 50%"></div>
        </div>
        <small style="color: #7f8c8d;">Storage Used</small>
      </div>
    </div>
    
    <div class="panel">
      <h3>👥 Your Team</h3>
      <div id="team" class="panel-content"></div>
    </div>

    <div class="panel">
      <h3>📊 Statistics</h3>
      <div id="stats" class="panel-content"></div>
    </div>
  </div>
  
  <div class="controls">
    <button id="buyIngredientsBtn">🛒 Buy Ingredients ($50)</button>
    <button id="upgradeBtn" style="display:none;">⭐ Open Restaurant! ($5,000)</button>
  </div>

  <div class="controls">
    <button id="saveBtn">💾 Save Game</button>
    <button id="resetBtn">🔄 New Game</button>
  </div>
  
  <div id="log">Welcome to Snack StacK! Start serving customers to build your empire! 🚀</div>
  
  <script>
    // ============================================
    // CANVAS SETUP
    // ============================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    canvas.width = 900;
    canvas.height = 550;

    // ============================================
    // GAME STATE
    // ============================================
    let money = 100;
    let totalEarned = 0;
    let totalCustomersServed = 0;
    let gameTime = 0;
    let customers = [];
    let nextCustomerId = 0;
    let earningsPerMinute = 0;
    let lastEarningsUpdate = Date.now();
    let achievementQueue = [];

    // ============================================
    // PLAYER
    // ============================================
    const player = {
      x: 150,
      y: 400,
      size: 30,
      speed: 4,
      color: "#ff6b35",
      name: "You"
    };

    // ============================================
    // SIBLING HELPER
    // ============================================
    const sibling = {
      x: 200,
      y: 400,
      size: 30,
      speed: 2.5,
      color: "#3498db",
      name: "Your Sibling",
      target: null,
      isServing: false,
      servingTimer: 0,
      totalServed: 0
    };

    // ============================================
    // FOOD TRUCK
    // ============================================
    const foodTruck = {
      x: 400,
      y: 220,
      width: 150,
      height: 100
    };

    // ============================================
    // RECIPES & INGREDIENTS
    // ============================================
    const recipes = {
      burger: {
        name: "🍔 Burger",
        unlocked: true,
        ingredients: { beef: 1, bun: 1, lettuce: 1 },
        price: 10,
        cost: 4,
        timesSold: 0
      },
      fries: {
        name: "🍟 Fries",
        unlocked: true,
        ingredients: { potato: 2, oil: 1 },
        price: 6,
        cost: 2,
        timesSold: 0
      },
      hotdog: {
        name: "🌭 Hot Dog",
        unlocked: false,
        ingredients: { sausage: 1, bun: 1 },
        price: 8,
        cost: 3,
        unlockCost: 250,
        timesSold: 0
      },
      tenders: {
        name: "🍗 Chicken Tenders",
        unlocked: false,
        ingredients: { chicken: 2, flour: 1, oil: 1 },
        price: 12,
        cost: 5,
        unlockCost: 400,
        timesSold: 0
      },
      pizza: {
        name: "🍕 Pizza Slice",
        unlocked: false,
        ingredients: { dough: 1, cheese: 1, tomato: 1 },
        price: 15,
        cost: 6,
        unlockCost: 800,
        timesSold: 0
      },
      taco: {
        name: "🌮 Taco",
        unlocked: false,
        ingredients: { beef: 1, tortilla: 1, lettuce: 1, cheese: 1 },
        price: 9,
        cost: 4,
        unlockCost: 600,
        timesSold: 0
      }
    };

    let ingredients = {
      beef: 15,
      chicken: 10,
      potato: 20,
      bun: 15,
      oil: 10,
      lettuce: 10,
      sausage: 0,
      flour: 0,
      dough: 0,
      cheese: 0,
      tomato: 0,
      tortilla: 0
    };

    const maxStorage = 200;

    // ============================================
    // INPUT
    // ============================================
    const keys = {};
    document.addEventListener("keydown", (e) => {
      keys[e.key.toLowerCase()] = true;
      
      if (e.key.toLowerCase() === 'e') {
        tryServeCustomer();
      }
    });
    document.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

    // ============================================
    // CUSTOMER SYSTEM
    // ============================================
    class Customer {
      constructor(recipe) {
        this.id = nextCustomerId++;
        this.recipe = recipe;
        this.x = -50;
        this.y = 380;
        this.size = 30;
        this.speed = 1 + Math.random() * 0.5;
        this.targetX = foodTruck.x - 120;
        this.waiting = false;
        this.waitTimer = 0;
        this.maxWaitTime = 240; // 4 seconds
        this.color = ["#9b59b6", "#e67e22", "#1abc9c", "#e91e63"][Math.floor(Math.random() * 4)];
        this.isServed = false;
        this.patience = 1.0;
      }
      
      update() {
        if (!this.waiting) {
          if (this.x < this.targetX) {
            this.x += this.speed;
          } else {
            this.waiting = true;
          }
        } else {
          this.waitTimer++;
          this.patience = 1 - (this.waitTimer / this.maxWaitTime);
          
          if (this.waitTimer > this.maxWaitTime && !this.isServed) {
            this.leave();
            return false;
          }
        }
        return true;
      }
      
      serve() {
        const recipe = recipes[this.recipe];
        
        let canMake = true;
        for (let ing in recipe.ingredients) {
          if (ingredients[ing] < recipe.ingredients[ing]) {
            canMake = false;
            break;
          }
        }
        
        if (!canMake) {
          updateLog("❌ Not enough ingredients for " + recipe.name + "!");
          return false;
        }
        
        for (let ing in recipe.ingredients) {
          ingredients[ing] -= recipe.ingredients[ing];
        }
        
        const tip = Math.floor(recipe.price * this.patience * 0.3);
        const total = recipe.price + tip;
        
        money += total;
        totalEarned += total;
        totalCustomersServed++;
        recipe.timesSold++;
        this.isServed = true;
        
        if (tip > 0) {
          updateLog(`✅ Served ${recipe.name} for $${recipe.price} + $${tip} tip!`);
        } else {
          updateLog(`✅ Served ${recipe.name} for $${recipe.price}!`);
        }
        
        checkAchievements();
        return true;
      }
      
      leave() {
        if (!this.isServed) {
          updateLog("😞 Customer left hungry! Lost reputation!");
        }
      }
      
      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        
        // Face
        ctx.fillStyle = "#fff";
        ctx.fillRect(this.x + 8, this.y + 8, 6, 6);
        ctx.fillRect(this.x + 16, this.y + 8, 6, 6);
        
        if (this.waiting) {
          // Order bubble
          ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
          ctx.beginPath();
          ctx.arc(this.x + 15, this.y - 20, 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#333";
          ctx.lineWidth = 2;
          ctx.stroke();
          
          ctx.font = "24px Arial";
          ctx.fillText(recipes[this.recipe].name.split(' ')[0], this.x - 3, this.y - 12);
          
          // Patience bar
          const barWidth = 35;
          const barHeight = 6;
          const fillWidth = this.patience * barWidth;
          
          const gradient = ctx.createLinearGradient(this.x, 0, this.x + barWidth, 0);
          if (this.patience > 0.6) {
            gradient.addColorStop(0, "#2ecc71");
            gradient.addColorStop(1, "#27ae60");
          } else if (this.patience > 0.3) {
            gradient.addColorStop(0, "#f39c12");
            gradient.addColorStop(1, "#e67e22");
          } else {
            gradient.addColorStop(0, "#e74c3c");
            gradient.addColorStop(1, "#c0392b");
          }
          
          ctx.fillStyle = gradient;
          ctx.fillRect(this.x, this.y - 35, fillWidth, barHeight);
          ctx.strokeStyle = "#2c3e50";
          ctx.lineWidth = 2;
          ctx.strokeRect(this.x, this.y - 35, barWidth, barHeight);
        }
      }
    }

    function spawnCustomer() {
      const availableRecipes = Object.keys(recipes).filter(r => recipes[r].unlocked);
      if (availableRecipes.length === 0) return;
      
      const weights = availableRecipes.map(r => recipes[r].price);
      const totalWeight = weights.reduce((a, b) => a + b, 0);
      let random = Math.random() * totalWeight;
      
      let selectedRecipe = availableRecipes[0];
      for (let i = 0; i < availableRecipes.length; i++) {
        random -= weights[i];
        if (random <= 0) {
          selectedRecipe = availableRecipes[i];
          break;
        }
      }
      
      customers.push(new Customer(selectedRecipe));
    }

    setInterval(() => {
      if (Math.random() < 0.35 && customers.length < 6) {
        spawnCustomer();
      }
    }, 2500);

    // ============================================
    // SERVING MECHANICS
    // ============================================
    function tryServeCustomer() {
      let nearest = null;
      let minDist = 100;
      
      for (let i = 0; i < customers.length; i++) {
        const c = customers[i];
        if (c.waiting && !c.isServed) {
          const dx = player.x - c.x;
          const dy = player.y - c.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < minDist) {
            nearest = c;
            minDist = dist;
          }
        }
      }
      
      if (nearest) {
        if (nearest.serve()) {
          setTimeout(() => {
            customers = customers.filter(c => c.id !== nearest.id);
          }, 300);
        }
      }
    }

    function updateSibling() {
      if (sibling.isServing) {
        sibling.servingTimer++;
        if (sibling.servingTimer > 90) {
          sibling.isServing = false;
          sibling.servingTimer = 0;
          if (sibling.target) {
            if (sibling.target.serve()) {
              sibling.totalServed++;
              setTimeout(() => {
                customers = customers.filter(c => c.id !== sibling.target.id);
              }, 300);
            }
            sibling.target = null;
          }
        }
        return;
      }
      
      let target = null;
      let oldestWaitTime = -1;
      
      for (let c of customers) {
        if (c.waiting && !c.isServed && c.waitTimer > oldestWaitTime) {
          target = c;
          oldestWaitTime = c.waitTimer;
        }
      }
      
      if (target) {
        sibling.target = target;
        const dx = sibling.x - target.x;
        const dy = sibling.y - target.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist > 50) {
          const angle = Math.atan2(target.y - sibling.y, target.x - sibling.x);
          sibling.x += Math.cos(angle) * sibling.speed;
          sibling.y += Math.sin(angle) * sibling.speed;
        } else {
          sibling.isServing = true;
          sibling.servingTimer = 0;
        }
      } else {
        const dx = sibling.x - 200;
        const dy = sibling.y - 400;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 5) {
          const angle = Math.atan2(400 - sibling.y, 200 - sibling.x);
          sibling.x += Math.cos(angle) * sibling.speed;
          sibling.y += Math.sin(angle) * sibling.speed;
        }
      }
    }

    // ============================================
    // PLAYER MOVEMENT
    // ============================================
    function movePlayer() {
      if (keys["w"] || keys["arrowup"]) player.y -= player.speed;
      if (keys["s"] || keys["arrowdown"]) player.y += player.speed;
      if (keys["a"] || keys["arrowleft"]) player.x -= player.speed;
      if (keys["d"] || keys["arrowright"]) player.x += player.speed;
      
      player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
      player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));
    }

    // ============================================
    // DRAWING
    // ============================================
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Sky
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, "#87CEEB");
      skyGrad.addColorStop(0.65, "#90EE90");
      skyGrad.addColorStop(1, "#8B7355");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Ground
      ctx.fillStyle = "#8B7355";
      ctx.fillRect(0, canvas.height - 170, canvas.width, 170);
      
      // Food Truck
      drawFoodTruck();
      
      // Customers
      customers.forEach(c => c.draw());
      
      // Sibling
      drawCharacter(sibling, "SIB");
      if (sibling.isServing) {
        ctx.fillStyle = "#2ecc71";
        ctx.font = "bold 14px Arial";
        ctx.fillText("Cooking...", sibling.x - 15, sibling.y - 15);
      }
      
      // Player
      drawCharacter(player, "YOU");
      
      // Serve prompt
      let nearCustomer = null;
      for (let i = 0; i < customers.length; i++) {
        const c = customers[i];
        const dx = player.x - c.x;
        const dy = player.y - c.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (c.waiting && !c.isServed && dist < 100) {
          nearCustomer = c;
          break;
        }
      }
      
      if (nearCustomer) {
        ctx.fillStyle = "rgba(46, 204, 113, 0.9)";
        ctx.fillRect(player.x - 35, player.y - 30, 100, 25);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 16px Arial";
        ctx.fillText("Press E", player.x - 20, player.y - 12);
      }
    }

    function drawFoodTruck() {
      // Truck body
      ctx.fillStyle = "#e74c3c";
      ctx.fillRect(foodTruck.x, foodTruck.y, foodTruck.width, foodTruck.height);
      
      // Shadow
      ctx.fillStyle = "rgba(0,0,0,0.2)";
      ctx.fillRect(foodTruck.x, foodTruck.y + foodTruck.height, foodTruck.width, 10);
      
      // Stripe
      ctx.fillStyle = "#c0392b";
      ctx.fillRect(foodTruck.x, foodTruck.y + 60, foodTruck.width, 40);
      
      // Wheels
      ctx.fillStyle = "#2c3e50";
      ctx.beginPath();
      ctx.arc(foodTruck.x + 35, foodTruck.y + 100, 15, 0, Math.PI * 2);
      ctx.arc(foodTruck.x + 115, foodTruck.y + 100, 15, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = "#95a5a6";
      ctx.beginPath();
      ctx.arc(foodTruck.x + 35, foodTruck.y + 100, 8, 0, Math.PI * 2);
      ctx.arc(foodTruck.x + 115, foodTruck.y + 100, 8, 0, Math.PI * 2);
      ctx.fill();
      
      // Window
      ctx.fillStyle = "#3498db";
      ctx.fillRect(foodTruck.x + 25, foodTruck.y + 15, 100, 40);
      
      // Window frame
      ctx.strokeStyle = "#2c3e50";
      ctx.lineWidth = 4;
      ctx.strokeRect(foodTruck.x + 25, foodTruck.y + 15, 100, 40);
      
      // Sign
      ctx.fillStyle = "#fff";
      ctx.font = "bold 18px Arial";
      ctx.fillText("SNACK", foodTruck.x + 45, foodTruck.y + 35);
      ctx.fillText("STACK", foodTruck.x + 45, foodTruck.y + 50);
      
      // Menu board
      ctx.fillStyle = "#34495e";
      ctx.fillRect(foodTruck.x - 50, foodTruck.y + 20, 40, 60);
      ctx.fillStyle = "#fff";
      ctx.font = "10px Arial";
      ctx.fillText("MENU", foodTruck.x - 45, foodTruck.y + 35);
    }

    function drawCharacter(char, label) {
      // Body
      ctx.fillStyle = char.color;
      ctx.fillRect(char.x, char.y, char.size, char.size);
      
      // Face
      ctx.fillStyle = "#fff";
      ctx.fillRect(char.x + 7, char.y + 8, 7, 7);
      ctx.fillRect(char.x + 16, char.y + 8, 7, 7);
      
      // Label
      ctx.fillStyle = "#fff";
      ctx.font = "bold 12px Arial";
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 3;
      ctx.strokeText(label, char.x + 3, char.y + 22);
      ctx.fillText(label, char.x + 3, char.y + 22);
    }

    // ============================================
    // UI UPDATES
    // ============================================
    function updateUI() {
      document.getElementById("money").textContent = `💰 Money: $${Math.floor(money)}`;
      document.getElementById("earnings").textContent = `📈 $/min: $${earningsPerMinute}`;
      document.getElementById("customers-count").textContent = `👥 Served: ${totalCustomersServed}`;
      
      // Recipes
      let recipesHTML = "";
      for (let key in recipes) {
        const r = recipes[key];
        if (r.unlocked) {
          recipesHTML += `
            <div class="recipe-item recipe-unlocked">
              <span>${r.name} - $${r.price}</span>
              <small>Sold: ${r.timesSold}</small>
            </div>`;
        } else {
          recipesHTML += `
            <div class="recipe-item recipe-locked">
              <span>${r.name}</span>
              <button class="unlock-btn" onclick="unlockRecipe('${key}')">$${r.unlockCost}</button>
            </div>`;
        }
      }
      document.getElementById("recipes").innerHTML = recipesHTML;
      
      // Ingredients
      let ingHTML = "";
      const emoji = {
        chicken:"🐔", beef:"🥩", potato:"🥔", bun:"🍞", oil:"🛢️", 
        lettuce:"🥬", sausage:"🌭", flour:"🌾", dough:"🍞", 
        cheese:"🧀", tomato:"🍅", tortilla:"🌯"
      };
      
      let totalItems = 0;
      for (let ing in ingredients) {
        totalItems += ingredients[ing];
        ingHTML += `<div class="ingredient-item">${emoji[ing] || ing}: ${ingredients[ing]}</div>`;
      }
      document.getElementById("ingredients").innerHTML = ingHTML;
      
      const storagePercent = (totalItems / maxStorage) * 100;
      document.getElementById("storage-progress").style.width = storagePercent + "%";
      
      // Team
      document.getElementById("team").innerHTML = `
        <div class="team-member" style="background: linear-gradient(135deg, #ff6b35, #ff8c55);">
          <strong>👤 ${player.name}</strong>
          <span>Owner</span>
        </div>
        <div class="team-member" style="background: linear-gradient(135deg, #3498db, #5dade2);">
          <strong>👥 ${sibling.name}</strong>
          <span>Served: ${sibling.totalServed}</span>
        </div>
      `;
      
      // Stats
      const profit = totalEarned - (totalCustomersServed * 2);
      document.getElementById("stats").innerHTML = `
        <div class="ingredient-item">💵 Total Earned: $${Math.floor(totalEarned)}</div>
        <div class="ingredient-item">📈 Profit: $${Math.floor(profit)}</div>
        <div class="ingredient-item">⏱️ Playing: ${formatTime(gameTime)}</div>
        <div class="ingredient-item">🎯 In Queue: ${customers.length}</div>
      `;
      
      // Show upgrade button
      if (money >= 5000) {
        document.getElementById("upgradeBtn").style.display = "inline-block";
      }
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}m ${secs}s`;
    }

    function updateLog(msg) {
      document.getElementById("log").textContent = msg;
    }

    // ============================================
    // RECIPE UNLOCKING
    // ============================================
    window.unlockRecipe = function(recipeKey) {
      const recipe = recipes[recipeKey];
      if (!recipe.unlocked && money >= recipe.unlockCost) {
        money -= recipe.unlockCost;
        recipe.unlocked = true;
        
        // Add ingredients for new recipe
        for (let ing in recipe.ingredients) {
          if (ingredients[ing] === 0) {
            ingredients[ing] = 5;
          }
        }
        
        showAchievement(`🎉 Unlocked ${recipe.name}!`);
        updateLog(`🎉 Unlocked ${recipe.name}! Now serving!`);
      } else if (money < recipe.unlockCost) {
        updateLog(`❌ Need $${recipe.unlockCost} to unlock ${recipe.name}!`);
      }
    };

    // ============================================
    // ACHIEVEMENTS
    // ============================================
    function checkAchievements() {
      if (totalCustomersServed === 1) {
        showAchievement("🎊 First Customer!");
      } else if (totalCustomersServed === 10) {
        showAchievement("🔥 10 Customers Served!");
      } else if (totalCustomersServed === 50) {
        showAchievement("⭐ 50 Customers! You're a pro!");
      } else if (money >= 1000 && !achievementQueue.includes("💰 Made $1,000!")) {
        showAchievement("💰 Made $1,000!");
      }
    }

    function showAchievement(text) {
      if (achievementQueue.includes(text)) return;
      achievementQueue.push(text);
      
      const div = document.createElement("div");
      div.className = "achievement";
      div.textContent = text;
      document.body.appendChild(div);
      
      setTimeout(() => {
        div.remove();
      }, 3000);
    }

    // ============================================
    // BUTTONS
    // ============================================
    document.getElementById("buyIngredientsBtn").addEventListener("click", () => {
      if (money >= 50) {
        money -= 50;
        const commonIngs = ["chicken", "beef", "potato", "bun", "oil", "lettuce"];
        commonIngs.forEach(ing => {
          if (ingredients[ing] !== undefined) {
            ingredients[ing] += 8;
          }
        });
        updateLog("✅ Restocked ingredients!");
      } else {
        updateLog("❌ Need $50 to buy ingredients!");
      }
    });

    document.getElementById("upgradeBtn").addEventListener("click", () => {
      if (money >= 5000) {
        updateLog("🎉 Congratulations! 🎉 Restaurant phase coming soon! Keep building your empire!");
        showAchievement("🏆 Ready for Restaurant!");
      }
    });

    document.getElementById("saveBtn").addEventListener("click", saveGame);
    document.getElementById("resetBtn").addEventListener("click", () => {
      if (confirm("Reset game? All progress will be lost!")) {
        localStorage.removeItem("snackStackSave");
        location.reload();
      }
    });

    // ============================================
    // SAVE/LOAD SYSTEM
    // ============================================
    function saveGame() {
      const saveData = {
        money,
        totalEarned,
        totalCustomersServed,
        gameTime,
        recipes,
        ingredients,
        siblingServed: sibling.totalServed
      };
      
      localStorage.setItem("snackStackSave", JSON.stringify(saveData));
      updateLog("💾 Game saved successfully!");
      showAchievement("💾 Game Saved!");
    }

    function loadGame() {
      const saved = localStorage.getItem("snackStackSave");
      if (saved) {
        try {
          const data = JSON.parse(saved);
          money = data.money || 100;
          totalEarned = data.totalEarned || 0;
          totalCustomersServed = data.totalCustomersServed || 0;
          gameTime = data.gameTime || 0;
          
          if (data.recipes) {
            for (let key in data.recipes) {
              if (recipes[key]) {
                recipes[key].unlocked = data.recipes[key].unlocked;
                recipes[key].timesSold = data.recipes[key].timesSold || 0;
              }
            }
          }
          
          if (data.ingredients) {
            ingredients = {...ingredients, ...data.ingredients};
          }
          
          if (data.siblingServed) {
            sibling.totalServed = data.siblingServed;
          }
          
          updateLog("✅ Game loaded! Welcome back!");
        } catch(e) {
          console.error("Load error:", e);
        }
      }
    }

    // ============================================
    // EARNINGS CALCULATION
    // ============================================
    function calculateEarnings() {
      const now = Date.now();
      const elapsed = (now - lastEarningsUpdate) / 1000;
      
      if (elapsed >= 60) {
        if (gameTime > 0) {
          earningsPerMinute = Math.floor((totalEarned / gameTime) * 60);
        }
        lastEarningsUpdate = now;
      }
    }

    // Auto-save every 30 seconds
    setInterval(saveGame, 30000);

    // ============================================
    // GAME LOOP
    // ============================================
    function loop() {
      try {
        movePlayer();
        updateSibling();
        
        customers = customers.filter(c => c.update());
        customers = customers.filter(c => !c.isServed);
        
        draw();
        updateUI();
        
        gameTime += 1/60;
        calculateEarnings();
        
        requestAnimationFrame(loop);
      } catch (error) {
        console.error("Game error:", error);
        updateLog("⚠️ Error: " + error.message);
      }
    }

    // ============================================
    // START GAME
    // ============================================
    if (!canvas || !ctx) {
      alert("Canvas failed to load!");
    } else {
      loadGame();
      console.log("🍔 Snack StacK loaded!");
      loop();
    }
  </script>
</body>
</html>
