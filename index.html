<!DOCTYPE html>
<html>
<head>
  <title>Snack StacK - Food Truck Empire</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🍔 Snack StacK</h1>
  
  <div class="stats">
    <div id="money">Money: $100</div>
    <div id="earnings">Earnings/min: $0</div>
    <div id="day">Day 1 - 8:00 AM</div>
  </div>
  
  <canvas id="game"></canvas>
  
  <div class="game-info">
    <div class="panel">
      <h3>📋 Recipes</h3>
      <div id="recipes"></div>
    </div>
    
    <div class="panel">
      <h3>🥡 Ingredients</h3>
      <div id="ingredients"></div>
    </div>
    
    <div class="panel">
      <h3>👥 Team</h3>
      <div id="team"></div>
    </div>
  </div>
  
  <div class="controls">
    <button id="buyIngredientsBtn">Buy Ingredients ($50)</button>
    <button id="upgradeBtn" style="display:none;">Upgrade to Restaurant ($5,000)</button>
  </div>
  
  <div id="log">WASD to move • E to serve customers • Watch your sibling help!</div>
  
  <script src="script.js"></script>
</body>
</html>
